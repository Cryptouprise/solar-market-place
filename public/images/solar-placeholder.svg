<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky Background -->
  <rect width="800" height="800" fill="url(#skyGradient)"/>
  
  <!-- Sun -->
  <circle cx="680" cy="120" r="60" fill="#FCD34D" opacity="0.9"/>
  <circle cx="680" cy="120" r="70" fill="#FCD34D" opacity="0.5"/>
  <circle cx="680" cy="120" r="80" fill="#FCD34D" opacity="0.3"/>
  
  <!-- Solar Panel -->
  <g transform="translate(200, 250)">
    <!-- Panel Shadow -->
    <rect x="10" y="10" width="400" height="320" rx="8" fill="#000" opacity="0.1"/>
    
    <!-- Main Panel -->
    <rect width="400" height="320" rx="8" fill="url(#panelGradient)"/>
    
    <!-- Panel Grid -->
    <g stroke="#60A5FA" stroke-width="3" opacity="0.6">
      <!-- Horizontal lines -->
      <line x1="0" y1="80" x2="400" y2="80"/>
      <line x1="0" y1="160" x2="400" y2="160"/>
      <line x1="0" y1="240" x2="400" y2="240"/>
      
      <!-- Vertical lines -->
      <line x1="100" y1="0" x2="100" y2="320"/>
      <line x1="200" y1="0" x2="200" y2="320"/>
      <line x1="300" y1="0" x2="300" y2="320"/>
    </g>
    
    <!-- Solar Cells -->
    <g fill="#3B82F6" opacity="0.4">
      <!-- Row 1 -->
      <rect x="10" y="10" width="80" height="60" rx="4"/>
      <rect x="110" y="10" width="80" height="60" rx="4"/>
      <rect x="210" y="10" width="80" height="60" rx="4"/>
      <rect x="310" y="10" width="80" height="60" rx="4"/>
      
      <!-- Row 2 -->
      <rect x="10" y="90" width="80" height="60" rx="4"/>
      <rect x="110" y="90" width="80" height="60" rx="4"/>
      <rect x="210" y="90" width="80" height="60" rx="4"/>
      <rect x="310" y="90" width="80" height="60" rx="4"/>
      
      <!-- Row 3 -->
      <rect x="10" y="170" width="80" height="60" rx="4"/>
      <rect x="110" y="170" width="80" height="60" rx="4"/>
      <rect x="210" y="170" width="80" height="60" rx="4"/>
      <rect x="310" y="170" width="80" height="60" rx="4"/>
      
      <!-- Row 4 -->
      <rect x="10" y="250" width="80" height="60" rx="4"/>
      <rect x="110" y="250" width="80" height="60" rx="4"/>
      <rect x="210" y="250" width="80" height="60" rx="4"/>
      <rect x="310" y="250" width="80" height="60" rx="4"/>
    </g>
    
    <!-- Highlights -->
    <g fill="#fff" opacity="0.2">
      <rect x="20" y="20" width="60" height="40" rx="2"/>
      <rect x="120" y="20" width="60" height="40" rx="2"/>
    </g>
  </g>
  
  <!-- Text -->
  <text x="400" y="650" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#1E3A8A" text-anchor="middle">Solar Panel</text>
  <text x="400" y="700" font-family="Arial, sans-serif" font-size="32" fill="#3B82F6" text-anchor="middle">Premium Quality</text>
</svg>
